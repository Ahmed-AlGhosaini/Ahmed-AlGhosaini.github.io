<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <!-- Placeholder hero: replace with your own robot photo, GIF or video (see src/data/profile.ts). -->
  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#d6d3d1"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fafaf9"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#dots)"/>

  <!-- table -->
  <rect x="0" y="640" width="1600" height="160" fill="#e7e5e4"/>
  <line x1="0" y1="640" x2="1600" y2="640" stroke="#a8a29e" stroke-width="2"/>

  <!-- target cube that the arm reaches toward -->
  <g>
    <rect x="1010" y="590" width="50" height="50" rx="6" fill="#1d4ed8">
      <animate attributeName="opacity" values="1;0.55;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- robot arm -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="690" y="600" width="120" height="40" rx="8" fill="#292524"/>
    <g transform="translate(750 600)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-35;20;-35" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
        <line x1="0" y1="0" x2="0" y2="-220" stroke="#44403c" stroke-width="36"/>
        <circle cx="0" cy="0" r="26" fill="#1c1917"/>
        <g transform="translate(0 -220)">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="70;105;70" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
            <line x1="0" y1="0" x2="0" y2="-180" stroke="#57534e" stroke-width="28"/>
            <circle cx="0" cy="0" r="22" fill="#1c1917"/>
            <g transform="translate(0 -180)">
              <g>
                <animateTransform attributeName="transform" type="rotate" values="40;55;40" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
                <circle cx="0" cy="0" r="16" fill="#1c1917"/>
                <line x1="0" y1="0" x2="0" y2="-60" stroke="#78716c" stroke-width="18"/>
                <path d="M -26 -60 H 26 M -22 -60 V -96 M 22 -60 V -96" stroke="#1d4ed8" stroke-width="10"/>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- perception overlay -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#78716c">
    <rect x="990" y="570" width="90" height="90" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="990" y="558" fill="#1d4ed8">cube 0.97</text>
    <text x="64" y="80">policy: vla-v2 · 10 Hz</text>
    <text x="64" y="112">task: "pick up the blue cube"</text>
  </g>
</svg>
